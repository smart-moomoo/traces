<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footprints · Seattle scene</title><style>body{margin:0;background:#f8f6f1;color:#60625e;font:13px ui-monospace,monospace}header,footer{max-width:960px;margin:20px auto;padding:0 20px;display:flex;align-items:center;gap:18px}header span{margin-left:auto;font-size:11px}h1{font:22px Georgia;font-weight:normal;margin:0}#stage{width:min(100%,1000px);aspect-ratio:4/3;margin:auto}button,a{background:none;border:1px solid #deddd5;border-radius:18px;padding:8px 14px;color:inherit;text-decoration:none;cursor:pointer}input{flex:1;min-width:60px;accent-color:#719997}#status{max-width:960px;margin:12px auto;padding:0 20px;line-height:1.7}details{max-width:960px;margin:18px auto;padding:0 20px}summary{cursor:pointer}pre{white-space:pre-wrap;font-size:11px}#benchmark{margin-top:12px}@media(max-width:600px){header,footer{gap:8px;margin:12px auto}header span{max-width:130px}button{padding:8px}h1{font-size:18px}}</style><header><h1>痕迹 · Seattle</h1><span>制作中 · 尚未验收</span><a href="index.html">地图</a></header><div id="stage" aria-label="西雅图货轮接近的材料场景动画"></div><footer><button id="play" disabled>播放</button><button id="replay" disabled>重播</button><input id="seek" type="range" aria-label="故事时间" min="0" max="36" step="0.01" value="0"><output id="time">0.0 / 36 秒</output></footer><p id="status" role="status">加载固定素材…</p><details><summary>制作与验证</summary><p>原海报分离船体，一次补全背景；船、倒影和尾迹共享连续运动；水面波动向周围传播，城市倒影和日照随之变化。没有整图帧序列。</p><label><input id="environment-only" type="checkbox"> 仅检查环境运动（隐藏船）</label><br><button id="audit-environment" disabled>检查环境像素变化</button><button id="benchmark" disabled>验证 1000 帧渲染</button><pre id="metrics"></pre><a href="animation/PLAN.md">完整实施方案</a> <a href="asset-review.html">素材分层检查</a></details><script src="vendor/pixi.min.js"></script><script type="module">
import {SeattleScene} from './animation/seattle.mjs';
const $=s=>document.querySelector(s);let scene;
try{scene=await SeattleScene.mount($('#stage'),{onTime:(t,s)=>{$('#seek').value=t;$('#time').textContent=t.toFixed(1)+' / 36 秒';if(s.ended)$('#play').textContent='重播';}});$('#status').textContent='4 份固定素材 · 无逐帧下载 · 可暂停和拖动时间';$('#play').disabled=$('#replay').disabled=$('#benchmark').disabled=$('#audit-environment').disabled=false;document.body.dataset.ready='true';
$('#play').onclick=()=>{if(scene.clock.paused){scene.play();$('#play').textContent='暂停';}else{scene.pause();$('#play').textContent='播放';}};
$('#replay').onclick=()=>{scene.seek(0);scene.play();$('#play').textContent='暂停';};
$('#seek').oninput=e=>{scene.pause();scene.seek(Number(e.target.value));$('#play').textContent='播放';};
$('#environment-only').onchange=e=>{scene.environmentOnly=e.target.checked;scene.render(scene.clock.time);};
$('#audit-environment').onclick=async()=>{$('#metrics').textContent=JSON.stringify(await scene.auditEnvironment(),null,2);};
$('#benchmark').onclick=async()=>{$('#benchmark').disabled=true;$('#metrics').textContent='正在实际渲染 1000 帧…';try{const m=await scene.benchmark(1000);$('#metrics').textContent=JSON.stringify(m,null,2);$('#metrics').dataset.complete='true';}catch(e){$('#metrics').textContent=e.message;}finally{$('#benchmark').disabled=false;}};
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){scene.play();$('#play').textContent='暂停';}
}catch(e){$('#status').textContent='加载失败：'+e.message;console.error(e);}
</script></html>
