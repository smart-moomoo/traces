<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footprints · 场景制作</title><style>body{margin:20px;background:#f8f6f1;color:#535955;font:14px system-ui}header,footer,#notes,#results{max-width:980px;margin:18px auto}header{display:flex;gap:16px;align-items:center}h1{font:22px Georgia;margin:0}select{padding:8px;max-width:60%}#stage{position:relative;max-width:1000px;aspect-ratio:4/3;margin:auto}footer{display:flex;gap:12px;align-items:center}input{flex:1;min-width:50px}button{padding:8px 14px;background:transparent;border:1px solid #c8ccc4;border-radius:16px;color:inherit;cursor:pointer}p{line-height:1.6}#results{white-space:pre-wrap;font:12px monospace}a{color:inherit}</style><header><h1>场景制作</h1><select id="scene" aria-label="地点"></select></header><div id="stage"></div><footer><button id="play">播放</button><button id="replay">重播</button><input id="seek" aria-label="时间" type="range" min="0" max="36" step="0.05" value="0"><output id="time"></output></footer><section id="notes"><h2 id="title"></h2><p>制作中：区域与时间轴可运行，不代表分层和完整故事已通过验收。</p><p id="remaining"></p><label><input id="regions" type="checkbox"> 检查区域与运动路径</label> <button id="protected-pixels">检查固定结构</button><button id="story-stages">查看故事阶段</button><button id="benchmark">渲染 1000 帧</button><button id="all">检查全部地点的渲染生命周期</button> <a href="animation/PLAN.md">完整方案</a></section><section id="storyboard" aria-label="故事阶段对照" style="max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px"></section><pre id="results"></pre><script src="vendor/pixi.min.js"></script><script type="module">
import {catalog} from './animation/catalog.mjs';import {MaterialScene} from './animation/material-scene.mjs';import {SeattleScene} from './animation/seattle.mjs';
const $=s=>document.querySelector(s);let player,current;
for(const s of catalog){const o=document.createElement('option');o.value=s.id;o.textContent=s.id.replaceAll('-',' ');$('#scene').append(o);}
function showRegions(){
 $('#stage svg')?.remove();if(!$('#regions').checked||!current)return;
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),w=current.crop[2],h=current.crop[3];svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
 for(const r of current.regions){const polygon=document.createElementNS(ns,'polygon');polygon.setAttribute('points',r.points.map(([x,y])=>`${x*w},${y*h}`).join(' '));const color={water:'#007eb0',foliage:'#07802d',cloth:'#bb5600',light:'#ac2b9a'}[r.kind];polygon.setAttribute('fill',color);polygon.setAttribute('fill-opacity','.15');polygon.setAttribute('stroke',color);polygon.setAttribute('stroke-width','2');svg.append(polygon);const label=document.createElementNS(ns,'text');label.setAttribute('x',r.points[0][0]*w);label.setAttribute('y',r.points[0][1]*h-5);label.setAttribute('fill',color);label.setAttribute('font-size','15');label.textContent=r.id;svg.append(label);}
 for(const object of current.objects||[]){const line=document.createElementNS(ns,'polyline');line.setAttribute('points',object.tracks.x.map((p,i)=>`${p.value},${object.tracks.y[i].value}`).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#ca4b22');line.setAttribute('stroke-dasharray','6 5');svg.append(line);}
 $('#stage').append(svg);
}
$('#regions').onchange=showRegions;
async function open(id){document.body.dataset.ready='false';$('#scene').disabled=true;$('#play').disabled=$('#replay').disabled=$('#benchmark').disabled=true;if(player){await player.destroy();player=null;}$('#stage').replaceChildren();$('#storyboard').replaceChildren();current=catalog.find(s=>s.id===id);$('#seek').max=current.duration;$('#title').textContent=current.title;$('#remaining').textContent='待完成：'+current.remaining.join(' ');$('#results').textContent='';
try{const options={scene:current,onTime:(t,s)=>{$('#seek').value=t;$('#time').textContent=t.toFixed(1)+' / '+current.duration+' 秒';$('#play').textContent=s.ended?'重播':(player?.clock.paused?'播放':'暂停');}};player=await (id==='Seattle'?SeattleScene:MaterialScene).mount($('#stage'),options);$('#play').textContent='播放';showRegions();document.body.dataset.ready='true';document.body.dataset.scene=id;$('#scene').value=id;$('#play').disabled=$('#replay').disabled=$('#benchmark').disabled=false;}
catch(e){$('#results').textContent=e.message;console.error(e);}finally{$('#scene').disabled=false;}}
$('#protected-pixels').onclick=async()=>{$('#results').textContent=JSON.stringify(player.auditStability?await player.auditStability():{available:false},null,2);};
$('#story-stages').onclick=()=>{
 const restore=player.clock.time;player.pause();$('#storyboard').replaceChildren();
 for(const fraction of [0,.25,.5,.75,1]){const t=current.duration*fraction;player.seek(t);const figure=document.createElement('figure');figure.style.margin='0';const image=document.createElement('img');image.src=player.app.canvas.toDataURL('image/png');image.alt=current.id+' '+t.toFixed(1)+'s';image.style.width='100%';const caption=document.createElement('figcaption');caption.textContent=t.toFixed(1)+' 秒';figure.append(image,caption);$('#storyboard').append(figure);}
 player.seek(restore);
};
$('#scene').onchange=e=>open(e.target.value);$('#play').onclick=()=>{if(player.clock.paused){player.play();$('#play').textContent='暂停';}else{player.pause();$('#play').textContent='播放';}};$('#replay').onclick=()=>{player.seek(0);player.play();$('#play').textContent='暂停';};$('#seek').oninput=e=>{player.pause();player.seek(Number(e.target.value));$('#play').textContent='播放';};$('#benchmark').onclick=async()=>{$('#benchmark').disabled=true;$('#scene').disabled=true;$('#results').textContent='正在渲染…';try{$('#results').textContent=JSON.stringify(await player.benchmark(),null,2);}finally{$('#benchmark').disabled=false;$('#scene').disabled=false;}};$('#all').onclick=async()=>{
 $('#all').disabled=true;const reports=[];document.body.dataset.audit='running';
 try{for(const item of catalog){await open(item.id);if(!player)throw new Error(item.id+' failed to mount');$('#scene').disabled=true;const result=await player.benchmark(1000);reports.push({id:item.id,...result});$('#results').textContent=JSON.stringify(reports,null,2);}
 document.body.dataset.audit='complete';}catch(e){reports.push({error:e.message});$('#results').textContent=JSON.stringify(reports,null,2);document.body.dataset.audit='failed';}finally{$('#all').disabled=false;$('#scene').disabled=false;}
};const requested=new URLSearchParams(location.search).get('scene');const initial=catalog.some(s=>s.id===requested)?requested:'Seattle';$('#scene').value=initial;await open(initial);
</script></html>
